name: Validate static portfolio
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          check-latest: true
          cache: npm
      - name: Install latest stable npm
        run: npm install --global npm@latest
      - name: Report toolchain versions
        run: |
          node --version
          npm --version
      - run: npm ci
      - run: npm run check
      - run: npm run build:functions
